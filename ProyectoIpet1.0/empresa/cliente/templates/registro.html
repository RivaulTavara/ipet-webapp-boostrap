{% extends "master.html" %}
{% load static %}



{% block contenido %}
    <link rel="stylesheet" href="{% static 'cliente/model/css/styleRegistro.css' %}">
    <div class="container">
      <div class="row  align-items-center">
          <!-- For Demo Purpose -->
          <div class="col-md-5 pr-lg-5 mb-5 mb-md-0" style="margin-right: 70px;">
              <img src="{% static 'cliente/images/perro y gato.png' %}" alt="" class="img-fluid mb-3 d-none d-md-block">
              <h2 id="h2registro" style="text-align: center;">Registro de nuevos usuarios</h2>
          </div>
        
          <!-- Registeration Form -->
          <div class="col-md-7 col-lg-6 ml-auto" style="overflow-y: auto; height: 100vh; scrollbar-width: none;">
            <form id="marginform" action="{% static 'cliente/model/php/controlador_register.php' %}" method="post">
                  <div class="row">
                  
                      <!-- Rut-->
                      <div class="mb-4">
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa fa-id-card text-muted" style="width: 15px;"></i></span>
                            <input type="text" class="form-control bg-white border-left-0 border-md" name="rut" id="rut" pattern="^\d{7,8}-[\dKk]{1}$" title="Por favor, ingresa el RUT sin puntos y con guión. Ejemplo: 12345678-9" required placeholder="XXXXXXXX-X">
                          </div>
                      </div>
                    
                      <!-- Email -->
                      <div class="mb-4">
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa fa-envelope text-muted" style="width: 15px;"></i></span>
                            <input type="email" class="form-control bg-white border-left-0 border-md" name="correo" id="correo" pattern=".+@.+\.com$" title="Por favor, ingresa un correo válido. Ejemplo: ejemplo@correo.com" required placeholder="ejemplo@correo.com">                      
                          </div>
                      </div>
                    
                    <!-- Primer Nombre -->
                      <div class="mb-4">
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa fa-user text-muted" style="width: 15px;"></i></span>
                            <input type="text" class="form-control bg-white border-left-0 border-md" id="nombre" name="nombre" pattern="^[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]*$" title="Por favor, ingresa solo letras." required placeholder="Pedro">
                        </div>
                      </div>
                    
                      <!-- Apellidos-->
                      <div class="mb-4">
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa fa-user text-muted" style="width: 15px;"></i></span>
                            <input type="text" name="apellido" class="form-control bg-white border-left-0 border-md" id="apellido" pattern="^[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]*$" title="Por favor, ingresa solo letras." required placeholder="Pascal">
                          </div>
                      </div>
                    
                      <!-- Contraseña-->
                      <div class="mb-4">
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa fa-lock text-muted" style="width: 15px;"></i></span>
                            <input type="password" id="password" name="password" class="form-control bg-white border-left-0 border-md" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*\W).{8,}" title="La contraseña debe contener al menos un carácter especial, una letra mayúscula, una letra minúscula y un número." required placeholder="Xx1234567@">
                          </div>
                      </div>
                    
                    
                      <!-- Fecha de Nacimiento -->
                      <div class="mb-4">
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa fa-calendar text-muted" style="width: 15px;"></i></span>
                            <input type="date" id="fechaNacimiento" name="fechaNacimiento" class="form-control bg-white border-left-0 border-md" required/>
                          </div>
                      </div>
                    
                    
                      <!-- Telefono -->
                      <div class="mb-4">
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa fa-phone-square text-muted" style="width: 15px;"></i></span>
                            <input type="tel" class="form-control bg-white border-left-0 border-md" id="telefono" name="telefono" pattern="^9\d{8}$" inputmode="numeric" title="Por favor, ingresa un número de teléfono válido con 9 dígitos y comenzando con 9. Ejemplo: 912345678" required placeholder="9 XXXX XXXX">
                          </div>
                      </div>
                    
                      <!-- Direccion -->
                      <div class="mb-4">
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa fa-location-arrow text-muted" style="width: 15px;"></i></span>
                            <input type="text" class="form-control bg-white border-left-0 border-md" id="direccion" name="direccion" required placeholder="Introduce tu dirección">
                          </div>
                      </div>
                    
                      <!-- Region -->
                      <div class="mb-4">
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa fa-map-marker text-muted" style="width: 15px;"></i></span>
                            <select id="region" name="region" class="form-select custom-select bg-white border-left-0 border-md">
                              <option value="">- Selecciona una región -</option>
                              <option value="Región de Arica y Parinacota">Región de Arica y Parinacota</option>
                              <option value="Región de Tarapacá">Región de Tarapacá</option>
                              <option value="Región de Antofagasta">Región de Antofagasta</option>
                              <option value="Región de Atacama">Región de Atacama</option>
                              <option value="Región de Coquimbo">Región de Coquimbo</option>
                              <option value=">Región de Valparaíso">Región de Valparaíso</option>
                              <option value="Región Metropolitana de Santiago">Región Metropolitana de Santiago</option>
                              <option value="Región del Libertador General Bernardo O'Higgins">Región del Libertador General Bernardo O'Higgins</option>
                              <option value="Región del Maule">Región del Maule</option>
                              <option value="Región de Ñuble">Región de Ñuble</option>
                              <option value="Región del Biobío">Región del Biobío</option>
                              <option value="Región de La Araucanía">Región de La Araucanía</option>
                              <option value="Región de Los Ríos">Región de Los Ríos</option>
                              <option value="Región de Los Lagos">Región de Los Lagos</option>
                              <option value="Región de Aysén del General Carlos Ibáñez del Campo">Región de Aysén del General Carlos Ibáñez del Campo</option>
                              <option value="Región de Magallanes y de la Antártica Chilena">Región de Magallanes y de la Antártica Chilena</option>
                          </select>                      
                        </div>
                      </div>
                    
                      <!-- Nivel Educacional -->
                      <div class="mb-4">
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa fa-graduation-cap text-muted" style="width: 15px;"></i></span>
                            <select id="nivelEducacional" name="nivelEducacional" class="form-select custom-select bg-white border-left-0 border-md">
                              <option value="">- Selecciona un nivel educacional -</option>
                              <option value="Primer ciclo">Primer ciclo</option>
                              <option value="Segundo ciclo">Segundo ciclo</option>
                              <option value="Técnico">Técnico</option>
                              <option value="Profesional">Profesional</option>
                              <option value="Sin estudios">Sin estudios</option>
                          </select>                      
                        </div>
                      </div>
                    
                    
                      <!-- Registrarse -->
                      <div class="form-group col-lg-12 mx-auto mb-0">
                        <button type="submit" class="btn btn-primary btn-block py-2" name="registro">Registrarse</button>
                      </div>
                    
                      <!-- texto divisor -->
                      <div class="form-group col-lg-12 mx-auto d-flex align-items-center my-4">
                          <div class="border-bottom w-100 ml-5"></div>
                          <span class="px-2 small text-muted font-weight-bold text-muted">O</span>
                          <div class="border-bottom w-100 mr-5"></div>
                      </div>
                    
                      <!-- registro por redes sociales -->
                      <div style="text-align: center;">
                        <div class="form-group col-lg-12 ms-auto">
                            <a href="#" class="btn btn-primary btn-block py-2 btn-facebook">
                                <i class="fa fa-facebook-f mr-2"></i>
                                <span class="font-weight-bold">Continuar con Facebook</span>
                            </a>
                        </div>
                        <div class="form-group col-lg-12 mx-auto" style="padding-top: 4px;">
                            <a href="#" class="btn btn-primary btn-block py-2 btn-twitter">
                                <i class="fa fa-twitter mr-2"></i>
                                <span class="font-weight-bold">Continuar con Twitter</span>
                            </a>
                        </div>
                      </div>
                    
                      <!-- Sesion existente -->
                      <div class="text-center w-100" style="padding-top: 15px; padding-bottom: 20px;">
                          <p class="text-muted font-weight-bold">Ya estás registrado? <a href="inicioSesion" class="text-primary ml-2">Inicia Sesión</a></p>
                      </div>
                    
                  </div>
              </form>
          </div>
      </div>
    </div>
{% endblock %}
