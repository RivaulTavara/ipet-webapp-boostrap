<!DOCTYPE html>
<html lang="en"></html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LogIPet</title>
    
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      crossorigin="anonymous"
    />

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>

    <nav class="navbar navbar-expand-lg navbar-light" style="background-color: #f8f9fa;"></nav>
      <div class="container-fluid">
        <a class="navbar-brand no-transition" href="main.html">
          <img src="src/logo.png" alt="IPet" width="35px" height="35px">
          IPet
      </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" aria-current="page" href="main.html">Productos Destacados</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="main.html">Galería de Productos</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="registro2.html">Registro de Usuarios</a>
            </li>
            
          </ul>
        </div>
      </div>
    </nav>
    
    <div class="form-login">
      <div class="text-center">
        <h1>🐶😺</h1>
        <h2>Bienvenido a IPet</h2>
        
      </div>
      <form class="mt-5" action="#">
        <div class="mb-4 col-lg-4 mx-auto">
          <label for="emailAddress" class="form-label fw-semibold"
            >Correo electrónico:</label>
          <input
            type="email"
            class="form-control"
          />
        </div>

        <div class="mb-4 col-lg-4 mx-auto">
          <label for="password" class="form-label fw-semibold">Password:</label>
          <input
            type="password"
            class="form-control"

          />
        </div>
        <div class="col-lg-4 mx-auto form-check">
          <input
            class="form-check-input"
            type="checkbox"
          />
          <label class="form-check-label fw-semibold mb-4" for="loggedIn">
            Mantener sesión iniciada.
          </label>
        </div>
        <div class="d-grid col-lg-4 mx-auto">
            <button type="button" class="btn btn-primary btn-lg">Iniciar sesion</button>
            <button type="button" class="btn btn-primary btn-lg" style="margin-top: 10px;" onclick="window.location.href='registro2.html'">Registrar</button>
        </div>
        
      </form>
      
    
   
    </div>


  </body>
</html>
