<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>IPet</title>
    <link rel="stylesheet" href="style.css">
  </head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light rounded fixed-top" style="background-color: var(--navbar-color);">
        <div class="container-fluid">
            <a class="navbar-brand no-transition" href="main.html" style="font-size: xx-large;">
                <img src="src/logo.png" alt="IPet" width="35px" height="35px">
                IPet
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" aria-current="page" href="main.html#productos" style="font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;">Productos Destacados</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="main.html#galeria" style="font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;">Galería de Productos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="registro.html" style="font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;">Registro de Usuarios</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

      <!-- Formulario web -->
      <div class="container mt-3" id="registro">
        <h2 class="text-center mt-1" id="registro" style="padding-top: 90px; margin-top: 90px;">Registro de nuevos usuarios</h2>
    <form>
    <div class="mb-3">
        <label for="rut" class="form-label">RUT</label>
        <input type="text" class="form-control" id="rut" required>
    </div>
    <div class="mb-3">
        <label for="nombre" class="form-label">Nombre</label>
        <input type="text" class="form-control" id="nombre" required>
    </div>
    <div class="mb-3">
        <label for="apellido" class="form-label">Apellido</label>
        <input type="text" class="form-control" id="apellido" required>
    </div>
    <div class="mb-3">
        <label for="correo" class="form-label">Correo</label>
        <input type="email" class="form-control" id="correo" required>
    </div>
    <div class="mb-3">
        <label for="fechaNacimiento" class="form-label">Fecha de Nacimiento</label>
        <input type="date" class="form-control" id="fechaNacimiento" required>
    </div>
    <div class="mb-3">
        <label for="telefono" class="form-label">Teléfono</label>
        <input type="tel" class="form-control" id="telefono" required>
    </div>
    <div class="mb-3">
        <label for="region" class="form-label">Región</label>
        <select class="form-select" id="region" required>
            <option selected>Selecciona una región</option>
            <!-- Aquí puedes agregar las opciones de las regiones -->
        </select>
    </div>
    <div class="mb-3">
        <label for="nivelEducacional" class="form-label">Nivel Educacional</label>
        <select class="form-select" id="nivelEducacional" required>
            <option selected>Selecciona un nivel educacional</option>
            <option value="doctor">Doctor</option>
            <option value="magister">Magíster</option>
            <option value="profesional">Profesional</option>
            <!-- Aquí puedes agregar más opciones si es necesario -->
        </select>
    </div>
    <button type="submit" class="btn btn-primary">Enviar</button>
    </form>
    </div>
          
</body>
</html>
